<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Netsoluções</title>
  <meta name="theme-color" content="#0b132b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Netsoluções">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    .glass-card { background: rgba(28, 37, 65, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .status-pago { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .status-aberto { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
    .status-cortado { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
  </style>
</head>
<body class="pb-24">
  <!-- Topo -->
  <header class="sticky top-0 z-40 bg-[#0b132b]/95 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/20">
        <i class="fa-solid fa-tower-broadcast text-lg"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-white leading-tight">Netsoluções</h1>
        <p class="text-[10px] text-cyan-400">Gestão Telecom</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button id="btnNovo" class="bg-cyan-600 hover:bg-cyan-500 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow-md shadow-cyan-600/30">
        <i class="fa-solid fa-plus"></i> Novo
      </button>
      <button id="btnInstalar" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow-md shadow-emerald-600/30">
        <i class="fa-solid fa-download"></i> Instalar
      </button>
      <button id="btnConfig" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center text-xs border border-slate-700">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-4 space-y-4">
    <!-- Metricas -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5">
      <div class="glass-card rounded-xl p-3">
        <span class="text-[11px] font-semibold text-slate-400 uppercase">Clientes</span>
        <div id="statTotalClientes" class="text-xl font-bold text-white mt-1">0</div>
        <div id="statEmDia" class="text-[10px] text-emerald-400 mt-0.5">0 pagos</div>
      </div>
      <div class="glass-card rounded-xl p-3">
        <span class="text-[11px] font-semibold text-slate-400 uppercase">Recebido</span>
        <div id="statTotalPago" class="text-xl font-bold text-emerald-400 mt-1">R$ 0</div>
        <div id="statCountPago" class="text-[10px] text-slate-400 mt-0.5">0 quitações</div>
      </div>
      <div class="glass-card rounded-xl p-3">
        <span class="text-[11px] font-semibold text-slate-400 uppercase">A Receber</span>
        <div id="statTotalAberto" class="text-xl font-bold text-amber-400 mt-1">R$ 0</div>
        <div id="statCountAberto" class="text-[10px] text-amber-400/80 mt-0.5">0 em aberto</div>
      </div>
      <div class="glass-card rounded-xl p-3">
        <span class="text-[11px] font-semibold text-slate-400 uppercase">Cortados</span>
        <div id="statTotalCortado" class="text-xl font-bold text-rose-400 mt-1">R$ 0</div>
        <div id="statCountCortado" class="text-[10px] text-rose-400/80 mt-0.5">0 bloqueados</div>
      </div>
    </div>

    <!-- Filtros -->
    <div class="glass-card rounded-xl p-3 space-y-2.5">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
        <input type="text" id="inputBusca" placeholder="Buscar cliente, CTO ou WhatsApp..." class="w-full bg-slate-900/90 border border-slate-700 rounded-lg pl-8 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <select id="filtroRamal" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="">Todos os Ramais</option>
        </select>
        <select id="filtroStatus" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="">Todos os Status</option>
          <option value="Pago">Pago</option>
          <option value="Aberto">Em Aberto</option>
          <option value="Cortado">Cortado</option>
        </select>
      </div>
    </div>

    <!-- Lista -->
    <div id="containerClientes" class="space-y-2.5"></div>
  </main>

  <!-- Modal Cliente (Novo / Editar) -->
  <div id="modalCliente" class="fixed inset-0 bg-black/85 z-50 hidden flex items-center justify-center p-4">
    <div class="glass-card bg-[#0e172a] rounded-2xl w-full max-w-sm p-4 space-y-3 border border-slate-700 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-2 border-b border-slate-800">
        <h3 id="modalClienteTitulo" class="font-bold text-white text-sm">Editar Cliente</h3>
        <button id="btnFecharModalCli" class="text-slate-400 p-1 text-base"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <input type="hidden" id="clienteId">
      <div>
        <label class="text-[11px] text-slate-400">Nome:</label>
        <input type="text" id="cliNome" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white mt-0.5">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[11px] text-slate-400">Ramal:</label>
          <input type="text" id="cliRamal" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white mt-0.5">
        </div>
        <div>
          <label class="text-[11px] text-slate-400">CTO / Porta:</label>
          <input type="text" id="cliCto" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white mt-0.5">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[11px] text-slate-400">Vencimento:</label>
          <input type="text" id="cliVencimento" placeholder="DD/MM/AAAA" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white mt-0.5">
        </div>
        <div>
          <label class="text-[11px] text-slate-400">Valor (R$):</label>
          <input type="number" id="cliValor" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white mt-0.5">
        </div>
      </div>
      <div>
        <label class="text-[11px] text-slate-400">WhatsApp (com DDD):</label>
        <input type="text" id="cliFone" placeholder="Ex: 92999998888" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white mt-0.5">
      </div>
      <div>
        <label class="text-[11px] text-slate-400">Status:</label>
        <select id="cliStatus" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white mt-0.5">
          <option value="Pago">Pago</option>
          <option value="Aberto">Em Aberto</option>
          <option value="Cortado">Cortado</option>
        </select>
      </div>
      <div class="pt-2 flex gap-2">
        <button id="btnSalvarCli" class="flex-1 py-2 bg-cyan-600 hover:bg-cyan-500 rounded-lg text-xs text-white font-bold">Salvar Dados</button>
        <button id="btnExcluirCli" class="px-3 py-2 bg-rose-950/70 border border-rose-800 text-rose-300 rounded-lg text-xs font-semibold">Excluir</button>
      </div>
    </div>
  </div>

  <!-- Modal Config -->
  <div id="modalConfig" class="fixed inset-0 bg-black/85 z-50 hidden flex items-center justify-center p-4">
    <div class="glass-card bg-[#0e172a] rounded-2xl w-full max-w-sm p-4 space-y-4 border border-slate-700">
      <div class="flex justify-between items-center pb-1 border-b border-slate-800">
        <h3 class="font-bold text-white text-sm">Configurações & Backup</h3>
        <button id="btnFecharConfig" class="text-slate-400 text-base"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div>
        <label class="text-xs text-slate-400">Chave PIX:</label>
        <input type="text" id="configPix" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs text-white mt-1">
      </div>
      <div class="space-y-2 pt-2 border-t border-slate-800">
        <button id="btnExportar" class="w-full py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs text-cyan-400 font-semibold flex items-center justify-center gap-2">
          <i class="fa-solid fa-download"></i> Baixar Backup (JSON)
        </button>
        <button id="btnRestaurar" class="w-full py-2 bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800/40 rounded-lg text-xs text-rose-300 font-semibold flex items-center justify-center gap-2">
          <i class="fa-solid fa-rotate-left">
