<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Netsoluções</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b132b; color: #f8fafc; padding-bottom: 80px; }
    header { background: #111c3a; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; position: sticky; top: 0; z-index: 10; }
    .btn { padding: 8px 12px; border-radius: 8px; border: none; font-weight: bold; font-size: 12px; cursor: pointer; }
    .btn-novo { background: #0891b2; color: #fff; }
    .btn-instalar { background: #059669; color: #fff; }
    .btn-cfg { background: #1e293b; color: #94a3b8; font-size: 15px; border: 1px solid #334155; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
    .card-stat { background: #16203a; padding: 12px; border-radius: 10px; border: 1px solid #233154; }
    .card-stat span { font-size: 11px; color: #94a3b8; }
    .card-stat h3 { font-size: 18px; margin-top: 4px; }
    .filtros { padding: 0 12px 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .input-busca, .select-ramal { width: 100%; padding: 9px 12px; background: #16203a; border: 1px solid #233154; color: #fff; border-radius: 8px; font-size: 12px; outline: none; }
    .lista { padding: 0 12px; display: flex; flex-direction: column; gap: 8px; }
    .card-cli { background: #16203a; border: 1px solid #233154; padding: 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 6px; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .tag-ramal { font-size: 10px; color: #38bdf8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .tag-cto { font-size: 11px; color: #94a3b8; margin-left: 4px; }
    .badge { font-size: 10px; padding: 3px 7px; border-radius: 6px; font-weight: bold; }
    .pago { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .aberto { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.4); }
    .cortado { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .detalhes { display: flex; justify-content: space-between; font-size: 11px; color: #cbd5e1; border-top: 1px solid #233154; padding-top: 6px; margin-top: 2px; }
    .acoes { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .btn-acao { padding: 5px 8px; border-radius: 6px; border: none; font-size: 11px; cursor: pointer; font-weight: 600; }
    .btn-zap { background: #059669; color: #fff; text-decoration: none; padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
    .modal-box { background: #0e172a; padding: 16px; border-radius: 14px; width: 100%; max-width: 340px; border: 1px solid #334155; max-height: 90vh; overflow-y: auto; }
    .modal-box input, .modal-box select { width: 100%; padding: 8px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; margin: 4px 0 10px 0; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h2 style="font-size:16px; font-weight:800;">Netsoluções</h2>
      <p style="font-size:10px; color:#38bdf8;">Gestão Telecom</p>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="btn btn-novo" onclick="abrirNovo()">+ Novo</button>
      <button class="btn btn-instalar" onclick="instalarApp()">Instalar</button>
      <button class="btn btn-cfg" onclick="abrirConfig()">⚙</button>
    </div>
  </header>

  <div class="grid">
    <div class="card-stat">
      <span>Clientes</span>
      <h3 id="statTotal">0</h3>
    </div>
    <div class="card-stat">
      <span>Recebido</span>
      <h3 id="statPago" style="color:#4ade80;">R$ 0</h3>
    </div>
    <div class="card-stat">
      <span>A Receber</span>
      <h3 id="statAberto" style="color:#facc15;">R$ 0</h3>
    </div>
    <div class="card-stat">
      <span>Cortados</span>
      <h3 id="statCortado" style="color:#f87171;">R$ 0</h3>
    </div>
  </div>

  <div class="filtros">
    <input type="text" id="inputBusca" class="input-busca" placeholder="🔍 Buscar cliente, ramal, CTO..." oninput="render()">
    <select id="selectRamal" class="select-ramal" onchange="render()">
      <option value="">Todos os Ramais</option>
    </select>
  </div>

  <div class="lista" id="listaClientes"></div>

  <!-- Modal Cadastro e Edição -->
  <div class="modal" id="modalCli">
    <div class="modal-box">
      <h3 id="modalTitulo" style="font-size:14px; margin-bottom:8px;">Cliente</h3>
      <input type="hidden" id="cliId">
      <label style="font-size:11px; color:#94a3b8;">Nome:</label>
      <input type="text" id="cliNome">
      <label style="font-size:11px; color:#94a3b8;">Ramal:</label>
      <input type="text" id="cliRamal">
      <label style="font-size:11px; color:#94a3b8;">CTO / Porta:</label>
      <input type="text" id="cliCto">
      <label style="font-size:11px; color:#94a3b8;">Vencimento:</label>
      <input type="text" id="cliVenc" placeholder="30/11/2026">
      <label style="font-size:11px; color:#94a3b8;">Valor (R$):</label>
      <input type="number" id="cliValor">
      <label style="font-size:11px; color:#94a3b8;">WhatsApp:</label>
      <input type="text" id="cliFone" placeholder="92999998888">
      <label style="font-size:11px; color:#94a3b8;">Status:</label>
      <select id="cliStatus">
        <option value="Pago">Pago</option>
        <option value="Aberto">Aberto</option>
        <option value="Cortado">Cortado</option>
      </select>
      <div style="display:flex; gap:6px;">
        <button class="btn btn-novo" style="flex:1;" onclick="salvarCli()">Salvar</button>
        <button id="btnExcluir" class="btn" style="background:#450a0a; color:#f87171;" onclick="excluirCli()">Excluir</button>
        <button class="btn" style="background:#1e293b; color:#94a3b8;" onclick="fecharModal()">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Modal Configurações -->
  <div class="modal" id="modalCfg">
    <div class="modal-box">
      <h3 style="font-size:14px; margin-bottom:8px;">Configurações</h3>
      <label style="font-size:11px; color:#94a3b8;">Chave PIX:</label>
      <input type="text" id="cfgPix">
      <div style="display:flex; flex-direction:column; gap:8px; margin-top:8px;">
        <button class="btn btn-novo" onclick="salvarCfg()">Salvar PIX</button>
        <button class="btn" style="background:#7f1d1d; color:#fff;" onclick="restaurarBase()">Restaurar Todos os 171 Clientes</button>
        <button class="btn" style="background:#1e293b; color:#94a3b8;" onclick="fecharCfg()">Fechar</button>
      </div>
    </div>
  </div>
