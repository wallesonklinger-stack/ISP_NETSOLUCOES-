<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Netsoluções</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b132b; color: #f8fafc; padding-bottom: 80px; }
    header { background: #111c3a; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; position: sticky; top: 0; z-index: 10; }
    .btn { padding: 8px 12px; border-radius: 6px; border: none; font-weight: bold; font-size: 12px; cursor: pointer; }
    .btn-novo { background: #0891b2; color: #fff; }
    .btn-cfg { background: #1e293b; color: #94a3b8; font-size: 16px; border: 1px solid #334155; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
    .card-stat { background: #1e293b; padding: 12px; border-radius: 8px; border: 1px solid #233154; }
    .card-stat span { font-size: 11px; color: #94a3b8; }
    .card-stat h3 { font-size: 18px; margin-top: 4px; }
    .filtros { padding: 0 12px 8px 12px; }
    .select-ramal { width: 100%; padding: 8px 12px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; font-size: 12px; outline: none; }
    .lista { padding: 0 12px; display: flex; flex-direction: column; gap: 8px; }
    .card-cli { background: #16203a; border: 1px solid #233154; padding: 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 6px; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .ramal-badge { display: inline-block; background: #0f172a; color: #38bdf8; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; border: 1px solid #0284c7; margin-bottom: 3px; }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .pago { background: #052e16; color: #4ade80; border: 1px solid #166534; }
    .aberto { background: #451a03; color: #facc15; border: 1px solid #854d0e; }
    .cortado { background: #450a0a; color: #f87171; border: 1px solid #991b1b; }
    .acoes { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
    .btn-acao { padding: 4px 8px; border-radius: 4px; border: none; font-size: 11px; cursor: pointer; font-weight: 600; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
    .modal-box { background: #0e172a; padding: 16px; border-radius: 12px; width: 100%; max-width: 340px; border: 1px solid #334155; max-height: 90vh; overflow-y: auto; }
    .modal-box input, .modal-box select { width: 100%; padding: 8px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 6px; margin: 4px 0 10px 0; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h2 style="font-size:16px;">Netsoluções</h2>
      <p style="font-size:11px; color:#38bdf8;">Gestão Telecom</p>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="btn btn-novo" onclick="abrirNovo()">+ Novo</button>
      <button class="btn btn-cfg" onclick="abrirConfig()">⚙</button>
    </div>
  </header>

  <div class="grid">
    <div class="card-stat">
      <span>Clientes</span>
      <h3 id="statTotal">0</h3>
    </div>
    <div class="card-stat">
      <span>Recebido</span>
      <h3 id="statPago" style="color:#4ade80;">R$ 0</h3>
    </div>
    <div class="card-stat">
      <span>A Receber</span>
      <h3 id="statAberto" style="color:#facc15;">R$ 0</h3>
    </div>
    <div class="card-stat">
      <span>Cortados</span>
      <h3 id="statCortado" style="color:#f87171;">R$ 0</h3>
    </div>
  </div>

  <div class="filtros">
    <select id="selectRamal" class="select-ramal" onchange="render()">
      <option value="">Todos os Ramais</option>
    </select>
  </div>

  <div class="lista" id="listaClientes"></div>

  <!-- Modal Cadastro e Edição -->
  <div class="modal" id="modalCli">
    <div class="modal-box">
      <h3 id="modalTitulo" style="font-size:14px; margin-bottom:8px;">Cliente</h3>
      <input type="hidden" id="cliId">
      <label style="font-size:11px;">Nome:</label>
      <input type="text" id="cliNome">
      <label style="font-size:11px;">Ramal:</label>
      <input type="text" id="cliRamal">
      <label style="font-size:11px;">CTO / Porta:</label>
      <input type="text" id="cliCto">
      <label style="font-size:11px;">Vencimento:</label>
      <input type="text" id="cliVenc" placeholder="30/11/2026">
