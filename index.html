<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ISP Manager Pro - Netsoluções</title>
  <meta name="theme-color" content="#0b132b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    .glass-card { background: rgba(28, 37, 65, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .status-pago { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .status-aberto { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
    .status-cortado { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
  </style>
</head>
<body class="pb-24">
  <!-- Topo -->
  <header class="sticky top-0 z-40 bg-[#0b132b]/95 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/20">
        <i class="fa-solid fa-tower-broadcast text-lg"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-white leading-tight">ISP Manager</h1>
        <p class="text-xs text-cyan-400">Netsoluções Telecom</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="abrirConfig()" class="w-9 h-9 rounded-lg bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center">
        <i class="fa-solid fa-gear"></i>
      </button>
      <button onclick="abrirModalCliente()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-2 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-lg shadow-cyan-600/30">
        <i class="fa-solid fa-plus"></i> Novo
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-4 space-y-4">
    <!-- Métricas -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5">
      <div class="glass-card rounded-xl p-3">
        <span class="text-[11px] font-semibold text-slate-400 uppercase">Clientes</span>
        <div id="statTotalClientes" class="text-xl font-bold text-white mt-1">0</div>
        <div id="statEmDia" class="text-[10px] text-emerald-400 mt-0.5">0 pagos</div>
      </div>
      <div class="glass-card rounded-xl p-3">
        <span class="text-[11px] font-semibold text-slate-400 uppercase">Recebido</span>
        <div id="statTotalPago" class="text-xl font-bold text-emerald-400 mt-1">R$ 0</div>
        <div id="statCountPago" class="text-[10px] text-slate-400 mt-0.5">0 quitações</div>
      </div>
      <div class="glass-card rounded-xl p-3">
        <span class="text-[11px] font-semibold text-slate-400 uppercase">A Receber</span>
        <div id="statTotalAberto" class="text-xl font-bold text-amber-400 mt-1">R$ 0</div>
        <div id="statCountAberto" class="text-[10px] text-amber-400/80 mt-0.5">0 em aberto</div>
      </div>
      <div class="glass-card rounded-xl p-3">
        <span class="text-[11px] font-semibold text-slate-400 uppercase">Cortados</span>
        <div id="statTotalCortado" class="text-xl font-bold text-rose-400 mt-1">R$ 0</div>
        <div id="statCountCortado" class="text-[10px] text-rose-400/80 mt-0.5">0 bloqueados</div>
      </div>
    </div>

    <!-- Barra de Pesquisa e Filtros -->
    <div class="glass-card rounded-xl p-3 space-y-2.5">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
        <input type="text" id="inputBusca" oninput="renderizar()" placeholder="Buscar cliente, CTO ou WhatsApp..." class="w-full bg-slate-900/90 border border-slate-700 rounded-lg pl-8 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <select id="filtroRamal" onchange="renderizar()" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="">Todos os Ramais</option>
        </select>
        <select id="filtroStatus" onchange="renderizar()" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="">Todos os Status</option>
          <option value="Pago">Pago</option>
          <option value="Aberto">Em Aberto</option>
          <option value="Cortado">Cortado</option>
        </select>
      </div>
    </div>

    <!-- Lista de Clientes -->
    <div id="containerClientes" class="space-y-2.5"></div>
  </main>

  <!-- Modal Configurações -->
  <div id="modalConfig" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
    <div class="glass-card bg-slate-900 rounded-2xl w-full max-w-sm p-4 space-y-4 border border-slate-700">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-white text-sm">Configurações & Backup</h3>
        <button onclick="fecharConfig()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div>
        <label class="text-xs text-slate-400">Chave PIX de Cobrança:</label>
        <input type="text" id="configPix" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white mt-1">
      </div>
      <div class="space-y-2 pt-2 border-t border-slate-800">
        <button onclick="exportarBackup()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs text-cyan-400 font-semibold flex items-center justify-center gap-2">
          <i class="fa-solid fa-download"></i> Baixar Backup (JSON)
        </button>
        <button onclick="restaurarPadrao()" class="w-full py-2 bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800/40 rounded-lg text-xs text-rose-300 font-semibold flex items-center justify-center gap-2">
          <i class="fa-solid fa-rotate-left"></i> Restaurar Todos os Clientes
        </button>
      </div>
      <button onclick="salvarConfig()" class="w-full py-2 bg-cyan-600 rounded-lg text-xs text-white font-bold">Salvar Configurações</button>
    </div>
  </div>

    function salvarDados() {
      localStorage.setItem('isp_clientes', JSON.stringify(clientes));
      localStorage.setItem('isp_config', JSON.stringify(config));
    }

    function popularRamais() {
      const select = document.getElementById('filtroRamal');
      const ramais = [...new Set(clientes.map(c => c.ramal))];
      select.innerHTML = '<option value="">Todos os Ramais</option>';
      ramais.forEach(r => {
        select.innerHTML += `<option value="${r}">${r}</option>`;
      });
    }

    function renderizar() {
      const container = document.getElementById('containerClientes');
      const busca = document.getElementById('inputBusca').value.toLowerCase();
      const ramalFiltro = document.getElementById('filtroRamal').value;
      const statusFiltro = document.getElementById('filtroStatus').value;

      let filtrados = clientes.filter(c => {
        const matchesBusca = c.nome.toLowerCase().includes(busca) || c.cto.toLowerCase().includes(busca) || c.fone.includes(busca);
        const matchesRamal = !ramalFiltro || c.ramal === ramalFiltro;
        const matchesStatus = !statusFiltro || c.status === statusFiltro;
        return matchesBusca && matchesRamal && matchesStatus;
      });

      // Atualizar métricas
      let totalRecebido = 0, totalAberto = 0, totalCortado = 0;
      let countPago = 0, countAberto = 0, countCortado = 0;

      clientes.forEach(c => {
        if (c.status === 'Pago') { totalRecebido += c.valor; countPago++; }
        else if (c.status === 'Aberto') { totalAberto += c.valor; countAberto++; }
        else if (c.status === 'Cortado') { totalCortado += c.valor; countCortado++; }
      });

      document.getElementById('statTotalClientes').innerText = clientes.length;
      document.getElementById('statEmDia').innerText = `${countPago} pagos`;
      document.getElementById('statTotalPago').innerText = `R$ ${totalRecebido.toLocaleString('pt-BR')}`;
      document.getElementById('statCountPago').innerText = `${countPago} quitações`;
      document.getElementById('statTotalAberto').innerText = `R$ ${totalAberto.toLocaleString('pt-BR')}`;
      document.getElementById('statCountAberto').innerText = `${countAberto} em aberto`;
      document.getElementById('statTotalCortado').innerText = `R$ ${totalCortado.toLocaleString('pt-BR')}`;
      document.getElementById('statCountCortado').innerText = `${countCortado} bloqueados`;

      // Renderizar Cards
      container.innerHTML = '';
      if (filtrados.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">Nenhum cliente encontrado.</div>`;
        return;
      }

      filtrados.forEach(c => {
        let badgeClass = c.status === 'Pago' ? 'status-pago' : (c.status === 'Aberto' ? 'status-aberto' : 'status-cortado');
        let iconStatus = c.status === 'Pago' ? 'fa-check' : (c.status === 'Aberto' ? 'fa-clock' : 'fa-xmark');

        container.innerHTML += `
          <div class="glass-card rounded-xl p-3 flex flex-col gap-2">
            <div class="flex items-center justify-between">
              <div>
                <span class="text-[10px] text-cyan-400 font-medium">${c.ramal}</span>
                <h4 class="text-sm font-bold text-white">${c.nome}</h4>
              </div>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold flex items-center gap-1 ${badgeClass}">
                <i class="fa-solid ${iconStatus}"></i> ${c.status}
              </span>
            </div>

            <div class="grid grid-cols-3 gap-1 py-1 border-y border-slate-800 text-[11px]">
              <div>
                <span class="text-[9px] text-slate-400 block">CTO / Porta</span>
                <span class="text-slate-200 font-medium">${c.cto}</span>
              </div>
              <div>
                <span class="text-[9px] text-slate-400 block">Vencimento</span>
                <span class="text-slate-200 font-medium">${c.vencimento}</span>
              </div>
              <div>
                <span class="text-[9px] text-slate-400 block">Valor</span>
                <span class="text-emerald-400 font-bold">R$ ${c.valor},00</span>
              </div>
            </div>

            <div class="flex items-center justify-between pt-1">
              <div class="flex gap-1">
                <button onclick="mudarStatus(${c.id}, 'Pago')" title="Marcar Pago" class="w-7 h-7 rounded-lg bg-emerald-950/60 text-emerald-400 border border-emerald-800/40 flex items-center justify-center text-xs">
                  <i class="fa-solid fa-check"></i>
                </button>
                <button onclick="mudarStatus(${c.id}, 'Aberto')" title="Marcar Em Aberto" class="w-7 h-7 rounded-lg bg-amber-950/60 text-amber-400 border border-amber-800/40 flex items-center justify-center text-xs">
                  <i class="fa-solid fa-clock"></i>
                </button>
                <button onclick="mudarStatus(${c.id}, 'Cortado')" title="Marcar Cortado" class="w-7 h-7 rounded-lg bg-rose-950/60 text-rose-400 border border-rose-800/40 flex items-center justify-center text-xs">
                  <i class="fa-solid fa-ban"></i>
                </button>
              </div>

              ${c.fone ? `
                <a href="https://wa.me/55${c.fone}?text=${encodeURIComponent('Olá ' + c.nome + ', segue a cobrança da sua internet Netsoluções Telecom no valor de R$ ' + c.valor + ',00 com vencimento em ' + c.vencimento + '. Chave PIX: ' + config.pix)}" target="_blank" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-white text-[11px] font-semibold flex items-center gap-1 shadow-md shadow-emerald-600/20">
                  <i class="fa-brands fa-whatsapp text-xs"></i> Cobrar PIX
                </a>
              ` : `
                <span class="text-[10px] text-slate-500 italic">Sem WhatsApp</span>
              `}
            </div>
          </div>
        `;
      });
    }

    function mudarStatus(id, novoStatus) {
      const index = clientes.findIndex(c => c.id === id);
      if (index !== -1) {
        clientes[index].status = novoStatus;
        salvarDados();
        renderizar();
      }
    }

    function abrirConfig() {
      document.getElementById('configPix').value = config.pix;
      document.getElementById('modalConfig').classList.remove('hidden');
    }
    function fecharConfig() {
      document.getElementById('modalConfig').classList.add('hidden');
    }
    function salvarConfig() {
      config.pix = document.getElementById('configPix').value;
      salvarDados();
      fecharConfig();
      renderizar();
    }
    function exportarBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(clientes));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "backup_isp_netsolucoes.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }
    function restaurarPadrao() {
      if (confirm("Deseja restaurar a base de dados completa lida das imagens?")) {
        clientes = [...CLIENTES_PADRAO];
        salvarDados();
        popularRamais();
        renderizar();
        fecharConfig();
      }
    }

    popularRamais();
    renderizar();
  </script>
</body>
</html>
