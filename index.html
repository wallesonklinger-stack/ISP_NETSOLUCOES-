<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Netsoluções</title>
  <meta name="theme-color" content="#0b132b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Netsoluções">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b132b; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    .glass-card { background: rgba(28, 37, 65, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .status-pago { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .status-aberto { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.3); }
    .status-cortado { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
  </style>
</head>
<body class="pb-24">
  <!-- Topo -->
  <header class="sticky top-0 z-40 bg-[#0b132b]/95 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/20">
        <i class="fa-solid fa-tower-broadcast text-lg"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-white leading-tight">Netsoluções</h1>
        <p class="text-[11px] text-cyan-400">Gestão Telecom</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button id="btnInstalarApp" onclick="acionarInstalacao()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1 shadow-md shadow-emerald-600/30">
        <i class="fa-solid fa-download"></i> Instalar
      </button>
      <button onclick="abrirModalCliente()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1 shadow-md shadow-cyan-600/30">
        <i class="fa-solid fa-plus"></i> Novo
      </button>
      <button onclick="abrirConfig()" class="w-8 h-8 rounded-lg bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center text-xs">
        <i class="fa-solid fa-gear"></i>
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-4 space-y-4">
    <!-- Metricas -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5">
      <div class="glass-card rounded-xl p-3">
        <span class="text-[11px] font-semibold text-slate-400 uppercase">Clientes</span>
        <div id="statTotalClientes" class="text-xl font-bold text-white mt-1">0</div>
        <div id="statEmDia" class="text-[10px] text-emerald-400 mt-0.5">0 pagos</div>
      </div>
      <div class="glass-card rounded-xl p-3">
        <span class="text-[11px] font-semibold text-slate-400 uppercase">Recebido</span>
        <div id="statTotalPago" class="text-xl font-bold text-emerald-400 mt-1">R$ 0</div>
        <div id="statCountPago" class="text-[10px] text-slate-400 mt-0.5">0 quitações</div>
      </div>
      <div class="glass-card rounded-xl p-3">
        <span class="text-[11px] font-semibold text-slate-400 uppercase">A Receber</span>
        <div id="statTotalAberto" class="text-xl font-bold text-amber-400 mt-1">R$ 0</div>
        <div id="statCountAberto" class="text-[10px] text-amber-400/80 mt-0.5">0 em aberto</div>
      </div>
      <div class="glass-card rounded-xl p-3">
        <span class="text-[11px] font-semibold text-slate-400 uppercase">Cortados</span>
        <div id="statTotalCortado" class="text-xl font-bold text-rose-400 mt-1">R$ 0</div>
        <div id="statCountCortado" class="text-[10px] text-rose-400/80 mt-0.5">0 bloqueados</div>
      </div>
    </div>

    <!-- Filtros -->
    <div class="glass-card rounded-xl p-3 space-y-2.5">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-xs"></i>
        <input type="text" id="inputBusca" oninput="renderizar()" placeholder="Buscar cliente, CTO ou WhatsApp..." class="w-full bg-slate-900/90 border border-slate-700 rounded-lg pl-8 pr-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <select id="filtroRamal" onchange="renderizar()" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="">Todos os Ramais</option>
        </select>
        <select id="filtroStatus" onchange="renderizar()" class="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-2 text-xs text-white focus:outline-none">
          <option value="">Todos os Status</option>
          <option value="Pago">Pago</option>
          <option value="Aberto">Em Aberto</option>
          <option value="Cortado">Cortado</option>
        </select>
      </div>
    </div>

    <!-- Lista de Clientes -->
    <div id="containerClientes" class="space-y-2.5"></div>
  </main>

  <!-- Modal Cadastro/Edição de Cliente -->
  <div id="modalCliente" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
    <div class="glass-card bg-slate-900 rounded-2xl w-full max-w-sm p-4 space-y-3 border border-slate-700 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center pb-2 border-b border-slate-800">
        <h3 id="modalClienteTitulo" class="font-bold text-white text-sm">Editar Cliente</h3>
        <button onclick="fecharModalCliente()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <input type="hidden" id="clienteId">
      <div>
        <label class="text-[11px] text-slate-400">Nome:</label>
        <input type="text" id="cliNome" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white mt-0.5">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[11px] text-slate-400">Ramal:</label>
          <input type="text" id="cliRamal" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white mt-0.5">
        </div>
        <div>
          <label class="text-[11px] text-slate-400">CTO / Porta:</label>
          <input type="text" id="cliCto" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white mt-0.5">
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[11px] text-slate-400">Vencimento:</label>
          <input type="text" id="cliVencimento" placeholder="DD/MM/AAAA" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white mt-0.5">
        </div>
        <div>
          <label class="text-[11px] text-slate-400">Valor (R$):</label>
          <input type="number" id="cliValor" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white mt-0.5">
        </div>
      </div>
      <div>
        <label class="text-[11px] text-slate-400">WhatsApp (com DDD):</label>
        <input type="text" id="cliFone" placeholder="Ex: 92999998888" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white mt-0.5">
      </div>
      <div>
        <label class="text-[11px] text-slate-400">Status:</label>
        <select id="cliStatus" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white mt-0.5">
          <option value="Pago">Pago</option>
          <option value="Aberto">Em Aberto</option>
          <option value="Cortado">Cortado</option>
        </select>
      </div>
      <div class="pt-2 flex gap-2">
        <button onclick="salvarCliente()" class="flex-1 py-2 bg-cyan-600 hover:bg-cyan-500 rounded-lg text-xs text-white font-bold">Salvar Dados</button>
        <button id="btnExcluirCli" onclick="excluirCliente()" class="px-3 py-2 bg-rose-950/60 border border-rose-800 text-rose-300 rounded-lg text-xs font-semibold">Excluir</button>
      </div>
    </div>
  </div>

  <!-- Modal Config -->
  <div id="modalConfig" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
    <div class="glass-card bg-slate-900 rounded-2xl w-full max-w-sm p-4 space-y-4 border border-slate-700">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-white text-sm">Configurações & Backup</h3>
        <button onclick="fecharConfig()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div>
        <label class="text-xs text-slate-400">Chave PIX de Cobrança:</label>
        <input type="text" id="configPix" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2 text-xs text-white mt-1">
      </div>
      <div class="space-y-2 pt-2 border-t border-slate-800">
        <button onclick="exportarBackup()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs text-cyan-400 font-semibold flex items-center justify-center gap-2">
          <i class="fa-solid fa-download"></i> Baixar Backup (JSON)
        </button>
        <button onclick="restaurarPadrao(true)" class="w-full py-2 bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800/40 rounded-lg text-xs text-rose-300 font-semibold flex items-center justify-center gap-2">
          <i class="fa-solid fa-rotate-left"></i> Restaurar Todos os 171 Clientes
        </button>
      </div>
      <button onclick="salvarConfig()" class="w-full py-2 bg-cyan-600 rounded-lg text-xs text-white font-bold">Salvar Configurações</button>
    </div>
  </div>

  <script>
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('btnInstalarApp');
      if (btn) btn.classList.remove('hidden');
    });

    function acionarInstalacao() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          deferredPrompt = null;
        });
      } else {
        alert("Para instalar agora no Android:\n\n1. Toque nos 3 pontinhos (⋮) do Chrome no canto superior.\n2. Escolha 'Criar atalho' ou 'Instalar aplicativo'.\n3. Marque 'Abrir como janela' e confirme!");
      }
    }

    (function() {
      const manifest = {
        name: "Netsoluções",
        short_name: "Netsoluções",
        start_url: window.location.href,
        display: "standalone",
        background_color: "#0b132b",
        theme_color: "#0b132b",
        icons: [{
          src: "data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%230b132b'/%3E%3Cpath d='M256 120a136 136 0 0 0-96.2 232.2l22.6-22.6a104 104 0 1 1 147.2 0l22.6 22.6A136 136 0 0 0 256 120z' fill='%2306b6d4'/%3E%3Cpath d='M256 184a72 72 0 0 0-50.9 122.9l22.6-22.6a40 40 0 1 1 56.6 0l22.6 22.6A72 72 0 0 0 256 184z' fill='%2338bdf8'/%3E%3Ccircle cx='256' cy='280' r='18' fill='%23ffffff'/%3E%3Crect x='250' y='298' width='12' height='114' rx='6' fill='%23ffffff'/%3E%3C/svg%3E",
          sizes: "512x512",
          type: "image/svg+xml"
        }]
      };
      const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = URL.createObjectURL(blob);
      document.head.appendChild(link);
    })();

    const CLIENTES_PADRAO = [
      // TARRAFINHA (R104)
      { id: 1, ramal: "TARRAFINHA", nome: "Ariadna", cto: "CTO 2", vencimento: "30/11/2026", valor: 130, status: "Pago", fone: "92991780727" },
      { id: 2, ramal: "TARRAFINHA", nome: "Rose", cto: "CTO 2", vencimento: "03/11/2026", valor: 130, status: "Pago", fone: "" },
      { id: 3, ramal: "TARRAFINHA", nome: "Gessiane", cto: "CTO 2", vencimento: "30/11/2026", valor: 130, status: "Pago", fone: "" },
      { id: 4, ramal: "TARRAFINHA", nome: "Marilene", cto: "CTO 3", vencimento: "30/11/2026", valor: 130, status: "Pago", fone: "97991521046" },
      { id: 5, ramal: "TARRAFINHA", nome: "Tainá", cto: "
